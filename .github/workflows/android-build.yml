name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            ${{ runner.os }}-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/DramaFy-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/DramaFy-release-unsigned.apk || true
          cp app/build/outputs/bundle/release/*.aab artifacts/DramaFy-release.aab || true
          ls -la artifacts/

      - name: Upload APK (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: DramaFy-debug
          path: artifacts/DramaFy-debug.apk
          if-no-files-found: warn

      - name: Upload APK (Release unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: DramaFy-release-unsigned
          path: artifacts/DramaFy-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DramaFy-release-aab
          path: artifacts/DramaFy-release.aab
          if-no-files-found: warn
